name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SHEETJS_SHA: d2f2e179636be22f3af3c306df7783ea10a2c7e3

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # No `version:` input: the action takes the pnpm version from
      # package.json's packageManager field (pnpm@11.27.0).
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # tsconfig.build.json has types: [], so this also catches Node globals in src
      - run: pnpm build
      # SheetJS, as a test-only oracle, pinned to the commit AGENTS.md names.
      - id: sheetjs-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/sheetjs
          key: sheetjs-${{ env.SHEETJS_SHA }}
      - if: steps.sheetjs-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          git init sheetjs
          git -C sheetjs fetch --depth 1 https://git.sheetjs.com/sheetjs/sheetjs.git "$SHEETJS_SHA"
          git -C sheetjs checkout FETCH_HEAD
      - run: pnpm test
        env:
          SHEETJS_DIR: ${{ runner.temp }}/sheetjs
          # fail instead of skipping the oracle tests if SheetJS is missing
          REQUIRE_ORACLE: "1"
      # Test-corpus checks: our committed fixtures, expectations and oracle scripts.
      # They need SheetJS (above) but not the SheetJS test_files archive or a prior cache:
      # the oracle results for our fixtures are rebuilt into test/corpus/.cache here.
      - name: Corpus checks
        env:
          SHEETJS_DIR: ${{ runner.temp }}/sheetjs
          # fail instead of skipping the selftest's SheetJS cases if SheetJS is missing
          REQUIRE_ORACLE: "1"
        run: |
          node --test scripts/corpus/*.test.mjs
          node scripts/corpus/generate.mjs --check
          node scripts/corpus/hidden-rows/generate.mjs --check
          node scripts/corpus/manifest.mjs
          node scripts/corpus/oracle.mjs --source generated --no-probe
          node scripts/corpus/oracle.mjs --source hidden-rows --no-probe
          node scripts/corpus/expected.mjs --check
          node scripts/corpus/oracle-selftest.mjs
